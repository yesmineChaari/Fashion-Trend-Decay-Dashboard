# Streamlit's own theme knobs, so `streamlit run app/streamlit_app.py` and
# `python tasks.py app` produce the identical look.
#
# These four colours are the only ones Streamlit applies to its own chrome.
# Everything else (typography, cards, pills, spacing) is
# `fashion_trends.app.styles`, which duplicates this palette as PALETTE
# since a TOML file cannot be imported. Change one, change the other.

[theme]
base = "light"
primaryColor = "#D55E00"
backgroundColor = "#FBFAF8"
secondaryBackgroundColor = "#F3EFE9"
textColor = "#1F1C1A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
