# Curated trend catalog.
#
# Each entry:
#   id:           stable slug, used as the key everywhere downstream
#   keyword:      exact string sent to Google Trends
#   display_name: human-readable label for charts/UI
#   category:     aesthetic | garment | accessory | styling
#   notes:        why this keyword was chosen (editorial judgement, kept visible)
#
# Every keyword below was probed against live Google Trends over
# 2021-09-01 .. 2026-09-01, geo=US, weekly granularity, before being kept.
# Peak weeks quoted in the notes are measured, not assumed.
# Selection rules and the keywords that were rejected are in docs/trend-selection.md.

- id: mob_wife
  keyword: "mob wife"
  display_name: "Mob wife aesthetic"
  category: aesthetic
  notes: "Flash fad. Flat baseline 2021-2023, peaks the week of 2024-01-14, back to baseline within roughly six weeks. The cleanest rise-and-fall in the catalog."

- id: demure
  keyword: "demure"
  display_name: "Very demure"
  category: styling
  notes: "The sharpest decay available. Essentially zero searches before August 2024, peaks 2024-08-18, and is back to 1% of peak by 2025. Highest absolute volume of any entry — roughly 130x the mob wife peak — so it must never share a Trends batch with a smaller keyword."

- id: labubu
  keyword: "labubu"
  display_name: "Labubu charms"
  category: accessory
  notes: "2025's dominant accessory fad. Zero until 2024, peaks 2025-07-13, down to ~19% of peak through 2026. Second-highest volume here, so it also needs its own batch."

- id: brat_summer
  keyword: "brat summer"
  display_name: "Brat summer"
  category: aesthetic
  notes: "Single-season fad tied to one album release. Zero before 2024, peaks 2024-07-21, 3% of peak in 2025. Useful as the seasonal-fad archetype against demure's meme-fad shape."

- id: office_siren
  keyword: "office siren"
  display_name: "Office siren"
  category: aesthetic
  notes: "Two-stage lifecycle: builds through 2024, peaks 2025-03-16, then falls to ~20% of peak in 2026. One of the few entries whose rise and fall both sit inside the window."

- id: mocha_mousse
  keyword: "mocha mousse"
  display_name: "Mocha Mousse"
  category: styling
  notes: "Colour-of-the-year fad with a known trigger date. Peaks 2024-12-01 on the Pantone announcement, halves in 2025, ~14% of peak by 2026 — a calendar-driven decay to compare against organic ones."

- id: coquette
  keyword: "coquette aesthetic"
  display_name: "Coquette"
  category: aesthetic
  notes: "Replaces the earlier 'bow trend fashion' keyword, which returned almost no data. Rises 2021-2023, peaks 2024-01-14, settles to a lower plateau rather than vanishing."

- id: tradwife
  keyword: "tradwife"
  display_name: "Tradwife"
  category: aesthetic
  notes: "Long-tailed decay: peaks 2024-02-25 and is still at ~78% of peak in 2026. Interest is driven as much by cultural commentary as by styling, which is worth stating when interpreting its curve."

- id: underconsumption
  keyword: "underconsumption"
  display_name: "Underconsumption core"
  category: aesthetic
  notes: "Anti-trend trend. Peaks 2024-12-29, holds through 2025, then halves in 2026 — a slower decay than the aesthetics it was reacting against."

- id: bag_charm
  keyword: "bag charm"
  display_name: "Bag charms"
  category: accessory
  notes: "Double-peaked: a 2024-10-27 high, a 2025 trough, then a second 2026 rise. The only revival shape in the catalog, and a good stress test for peak detection that assumes a single maximum."

- id: barbiecore
  keyword: "barbiecore"
  display_name: "Barbiecore"
  category: aesthetic
  notes: "Textbook single-event fad. Peaks 2023-07-16 on the film release and drops to under 10% of peak the following year."

- id: coastal_grandmother
  keyword: "coastal grandmother"
  display_name: "Coastal grandmother"
  category: aesthetic
  notes: "One-summer microtrend. Peaks 2022-07-17 and never recovers — 2023 onward sits below 20% of peak."

- id: cottagecore
  keyword: "cottagecore"
  display_name: "Cottagecore"
  category: aesthetic
  notes: "Enters the window already declining from its 2020 high and fades steadily through 2025. Exercises the 'peak precedes the window' path that most entries do not."

- id: clean_girl
  keyword: "clean girl aesthetic"
  display_name: "Clean girl"
  category: aesthetic
  notes: "Peaks 2022-05-29 but never decays properly — still above half of peak four years later. The catalog's main example of a trend that became a baseline."

- id: old_money
  keyword: "old money aesthetic"
  display_name: "Old money aesthetic"
  category: aesthetic
  notes: "Broad plateau rather than a spike: peaks 2023-09-03 with over half the weeks in the window sitting above 50% of peak. Kept as the low-decay counterexample."

- id: balaclava
  keyword: "balaclava"
  display_name: "Balaclava"
  category: accessory
  notes: "Not a decay curve at all — an annual winter cycle that repeats at near-full amplitude every year. Kept deliberately so seasonality is not mistaken for a lifecycle."

- id: bucket_hat
  keyword: "bucket hat"
  display_name: "Bucket hat"
  category: accessory
  notes: "The summer counterpart to balaclava: a repeating June-July cycle with a mild downward drift. Second seasonality control."
