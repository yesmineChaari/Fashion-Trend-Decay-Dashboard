[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion_trends"
version = "0.1.0"
description = "Measuring how fast fashion micro-trends rise and fall via Google Trends search interest."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
