# Optional: `pip install pre-commit && pre-commit install` to run lint and
# the test suite before every commit. Not required for local development --
# `python tasks.py lint` and `python tasks.py test` do the same checks on
# demand.
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint (ruff check + format --check)
        entry: python tasks.py lint
        language: system
        pass_filenames: false
      - id: test
        name: test (pytest)
        entry: python tasks.py test
        language: system
        pass_filenames: false
