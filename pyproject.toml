[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion_trends"
version = "0.1.0"
description = "Measuring how fast fashion micro-trends rise and fall via Google Trends search interest."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "scripts", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "offline: never touches the network (the suite-wide default, enforced by tests/conftest.py's autouse socket guard)",
]
